<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace | Dark Mode</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --panel-color: #161616;
            --text-color: #e0e0e0;
            --accent-color: #ffffff;
            --input-bg: #212121;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Шапка */
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #222;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        /* Область чата */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .message {
            max-width: 80%;
            line-height: 1.6;
        }

        .ai-message {
            align-self: flex-start;
        }

        .user-message {
            align-self: flex-end;
            background: var(--panel-color);
            padding: 12px 18px;
            border-radius: 15px;
        }

        /* Контейнер ввода */
        .input-area {
            padding: 20px 20%;
            background: linear-gradient(transparent, var(--bg-color) 20%);
        }

        .input-wrapper {
            background: var(--input-bg);
            border-radius: 24px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #333;
            transition: border 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: #555;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            resize: none;
            outline: none;
            font-size: 1rem;
            padding: 8px 0;
            max-height: 200px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            color: var(--accent-color);
            background: #333;
        }

        .send-btn {
            background: var(--accent-color);
            color: black;
        }

        .send-btn:hover {
            background: #ccc;
        }

        /* Скрытый инпут для файлов */
        #file-input { display: none; }

        /* Адаптивность */
        @media (max-width: 768px) {
            #chat-container, .input-area { padding-left: 5%; padding-right: 5%; }
        }
    </style>
</head>
<body>

    <header>Gemini 3.0 Flash</header>

    <div id="chat-container">
        <div class="message ai-message">
            Привет! Я твоя нейросеть. Могу сгенерировать картинку, проанализировать файл или просто поболтать. Чем займемся?
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Загрузить файл">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </button>
            <input type="file" id="file-input" multiple>

            <textarea id="user-input" placeholder="Спроси о чем угодно..." rows="1"></textarea>

            <button class="icon-btn send-btn" id="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('user-input');
        
        // Автоматическое расширение текстового поля
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Простая логика «отправки» для визуала
        document.getElementById('send-btn').addEventListener('click', () => {
            const text = textarea.value.trim();
            if (text) {
                const chat = document.getElementById('chat-container');
                chat.innerHTML += `<div class="message user-message">${text}</div>`;
                textarea.value = '';
                textarea.style.height = 'auto';
                chat.scrollTop = chat.scrollHeight;
            }
        });
    </script>
</body>
</html>
