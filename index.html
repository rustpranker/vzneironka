<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Private Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --panel: #111111;
            --input-bg: #161616;
            --text: #ffffff;
            --accent: #ffffff;
            --secondary: #666;
            --error: #ff4444;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 15px;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--secondary);
            border-bottom: 1px solid #1a1a1a;
            text-transform: uppercase;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .msg { max-width: 85%; line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap; }
        .ai-msg { align-self: flex-start; border-left: 2px solid #333; padding-left: 20px; color: #e0e0e0; }
        .user-msg { align-self: flex-end; background: var(--panel); padding: 12px 20px; border-radius: 18px; color: var(--accent); border: 1px solid #222; }
        .error-msg { color: var(--error); border-left-color: var(--error); font-size: 0.85rem; }

        .input-area { padding: 20px 20% 40px; background: var(--bg); }
        .preview-container { margin-bottom: 10px; }
        .preview-img { max-width: 150px; border-radius: 8px; border: 1px solid #333; display: none; }

        .input-wrapper {
            background: var(--input-bg);
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #222;
            transition: 0.3s;
        }

        .input-wrapper:focus-within { border-color: #444; }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            resize: none;
            outline: none;
            font-size: 1rem;
            padding: 10px 0;
            max-height: 180px;
            font-family: inherit;
        }

        .btn {
            background: none;
            border: none;
            color: var(--secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn:hover { color: #fff; background: #252525; }
        .send-btn { background: #fff; color: #000; padding: 10px; }
        .send-btn:hover { background: #ddd; transform: scale(1.05); }

        #file-input { display: none; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }

        @media (max-width: 800px) {
            #chat-window, .input-area { padding-left: 5%; padding-right: 5%; }
        }
    </style>
</head>
<body>

<header>Gemini 1.5 Flash Connection</header>

<div id="chat-window">
    <div class="msg ai-msg">Терминал активирован. Я подключена напрямую через Google API. Могу анализировать текст и изображения.</div>
</div>

<div class="input-area">
    <div class="preview-container">
        <img id="image-preview" class="preview-img">
    </div>
    <div class="input-wrapper">
        <button class="btn" title="Добавить изображение" onclick="document.getElementById('file-input').click()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        </button>
        <input type="file" id="file-input" accept="image/*">
        
        <textarea id="user-input" placeholder="Задайте вопрос..." rows="1"></textarea>
        
        <button class="btn send-btn" id="send-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>
</div>

<script>
    // === ВСТАВЬ СВОЙ API КЛЮЧ ТУТ ===
    const API_KEY = "AIzaSyCAN_GxfZJ0gXZb_cOLk0U8moox9DWpr7o"; 
    
    const userInput = document.getElementById('user-input');
    const chatWindow = document.getElementById('chat-window');
    const fileInput = document.getElementById('file-input');
    const imagePreview = document.getElementById('image-preview');
    let base64Image = null;

    // Чтение изображения
    fileInput.onchange = e => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                base64Image = event.target.result.split(',')[1];
                imagePreview.src = event.target.result;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    };

    function addMessage(text, isUser, isError = false) {
        const div = document.createElement('div');
        const id = "msg-" + Date.now();
        div.id = id;
        div.className = `msg ${isUser ? 'user-msg' : 'ai-msg'} ${isError ? 'error-msg' : ''}`;
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return id;
    }

    async function callAI() {
        const text = userInput.value.trim();
        if (!text && !base64Image) return;

        // Показываем сообщение пользователя
        addMessage(text || "Проанализируй это изображение", true);
        
        // Очистка ввода
        userInput.value = '';
        userInput.style.height = 'auto';
        imagePreview.style.display = 'none';
        
        const loadingId = addMessage("Связь с нейросетью...", false);

        // Сборка запроса
        const payload = {
            contents: [{
                parts: []
            }]
        };

        if (text) payload.contents[0].parts.push({ text: text });
        if (base64Image) {
            payload.contents[0].parts.push({
                inline_data: { mime_type: "image/png", data: base64Image }
            });
        }

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (data.error) {
                document.getElementById(loadingId).innerText = "Ошибка API: " + data.error.message;
                document.getElementById(loadingId).classList.add('error-msg');
            } else {
                const aiResponse = data.candidates[0].content.parts[0].text;
                document.getElementById(loadingId).innerText = aiResponse;
            }
        } catch (err) {
            document.getElementById(loadingId).innerText = "Ошибка сети. Проверь консоль (F12).";
            document.getElementById(loadingId).classList.add('error-msg');
        } finally {
            base64Image = null; // Сброс данных после отправки
        }
    }

    document.getElementById('send-btn').onclick = callAI;

    // Обработка клавиши Enter
    userInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            callAI();
        }
    });

    // Авто-высота текста
    userInput.oninput = function() {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';
    };
</script>

</body>
</html>
